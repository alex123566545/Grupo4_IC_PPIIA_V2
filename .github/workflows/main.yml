name: SIPREM-BOVINO ML Pipeline

on:

  # ============================================================
  # EJECUCIÓN MANUAL
  # ============================================================
  workflow_dispatch:
    inputs:

      proceso:
        description: "Selecciona el proceso que deseas ejecutar"
        required: true
        default: "prediccion"
        type: choice

        options:
          - prediccion
          - reentrenamiento


jobs:

  # ============================================================
  # JOB DE PREDICCIÓN
  # ============================================================
  prediccion:

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.proceso == 'prediccion'

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. Descargar repositorio
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # 2. Configurar Python
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ========================================================
      # 3. Instalar dependencias
      # ========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ========================================================
      # 4. Verificar conexión con Supabase
      # ========================================================
      - name: Verify Supabase connection
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |
          python -c "
          import os
          import psycopg2

          print('==============================================')
          print('🔎 VERIFICACIÓN DE CONEXIÓN SUPABASE')
          print('==============================================')

          print(
              'PASSWORD CONFIGURADA:',
              bool(os.getenv('SUPABASE_DB_PASSWORD'))
          )

          conn = psycopg2.connect(
              host='aws-0-us-west-2.pooler.supabase.com',
              port=5432,
              database='postgres',
              user='postgres.cuxppijddpiuaxwyswfb',
              password=os.getenv('SUPABASE_DB_PASSWORD'),
              sslmode='require'
          )

          cur = conn.cursor()

          cur.execute('''
              SELECT
                  current_database(),
                  current_user,
                  inet_server_addr(),
                  inet_server_port();
          ''')

          print('CONEXIÓN:', cur.fetchone())

          cur.close()
          conn.close()

          print('==============================================')
          print('✅ CONEXIÓN CORRECTA')
          print('==============================================')
          "


      # ========================================================
      # 5. Generar predicciones
      # ========================================================
      - name: Generate predictions
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |
          echo "=============================================="
          echo "🐄 GENERANDO PREDICCIONES"
          echo "=============================================="

          python main_prediccion.py


      # ========================================================
      # 6. Guardar artifacts del modelo
      # ========================================================
      - name: Upload ML artifacts
        uses: actions/upload-artifact@v4
        if: always()

        with:
          name: siprem-ml-models
          path: |
            models/model.pkl
            models/encoders.pkl
            models/threshold_rf_sin_lote29.pkl
            models/candidate/*
            models/comparacion_modelos.csv
            models/diagnostico_lotes_rf_sin_lote29.csv
            models/predicciones_test_rf_sin_lote29.csv

          if-no-files-found: ignore


      # ========================================================
      # 7. Guardar predicciones
      # ========================================================
      - name: Upload predictions CSV
        uses: actions/upload-artifact@v4
        if: always()

        with:
          name: siprem-predictions
          path: |
            models/predicciones_dataset.csv

          if-no-files-found: ignore


      # ========================================================
      # 8. Final predicción
      # ========================================================
      - name: Prediction finished
        run: |

          echo "=============================================="
          echo "🐄 SIPREM-BOVINO"
          echo "=============================================="

          echo "✅ PREDICCIONES GENERADAS CORRECTAMENTE"
          echo ""
          echo "Las predicciones que hayan cumplido"
          echo "su horizonte de 4 semanas deben ser"
          echo "verificadas antes del reentrenamiento."

          echo "=============================================="


  # ============================================================
  # JOB DE REENTRENAMIENTO
  # ============================================================
  reentrenamiento:

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.proceso == 'reentrenamiento'

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. Descargar repositorio
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # 2. Configurar Python
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ========================================================
      # 3. Instalar dependencias
      # ========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ========================================================
      # 4. Verificar Supabase y VIEW
      # ========================================================
      - name: Verify Supabase and training view
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |
          python -c "
          import os
          import psycopg2

          print('==============================================')
          print('🔎 VERIFICANDO SUPABASE')
          print('==============================================')

          conn = psycopg2.connect(
              host='aws-0-us-west-2.pooler.supabase.com',
              port=5432,
              database='postgres',
              user='postgres.cuxppijddpiuaxwyswfb',
              password=os.getenv('SUPABASE_DB_PASSWORD'),
              sslmode='require'
          )

          cur = conn.cursor()

          cur.execute('''
              SELECT
                  n.nspname,
                  c.relname,
                  c.relkind
              FROM pg_class c
              JOIN pg_namespace n
                  ON n.oid = c.relnamespace
              WHERE n.nspname = 'gold_ml'
                AND c.relname =
                    'predicciones_verificadas_sin_intervencion'
                AND c.relkind = 'v';
          ''')

          resultado = cur.fetchone()

          print('VISTA ENCONTRADA:', resultado)

          if resultado is None:
              print(
                  '❌ NO SE ENCONTRÓ LA VISTA '
                  'gold_ml.predicciones_verificadas_sin_intervencion'
              )
              raise SystemExit(1)

          print(
              '✅ LA VISTA EXISTE Y ES VISIBLE DESDE GITHUB'
          )

          cur.close()
          conn.close()

          print('==============================================')
          print('✅ VERIFICACIÓN FINALIZADA')
          print('==============================================')
          "


      # ========================================================
      # 5. Reentrenar modelo
      # ========================================================
      - name: Retrain model
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |

          echo "=============================================="
          echo "🧠 INICIANDO REENTRENAMIENTO"
          echo "=============================================="

          python main_reentrenamiento.py


      # ========================================================
      # 6. Guardar artifacts
      # ========================================================
      - name: Upload ML artifacts
        uses: actions/upload-artifact@v4
        if: always()

        with:
          name: siprem-retrained-model
          path: |
            models/model.pkl
            models/encoders.pkl
            models/threshold_rf_sin_lote29.pkl
            models/candidate/*
            models/comparacion_modelos.csv
            models/diagnostico_lotes_rf_sin_lote29.csv
            models/predicciones_test_rf_sin_lote29.csv

          if-no-files-found: ignore


      # ========================================================
      # 7. Final reentrenamiento
      # ========================================================
      - name: Retraining finished
        run: |

          echo "=============================================="
          echo "🐄 SIPREM-BOVINO"
          echo "=============================================="

          echo "✅ REENTRENAMIENTO EJECUTADO CORRECTAMENTE"
          echo "✅ MODELO EVALUADO"
          echo "✅ ARTIFACTS GUARDADOS"

          echo "=============================================="
