name: SIPREM-BOVINO ML Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '0 6 * * 1'


jobs:
  siprem_pipeline:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Descargar el repositorio
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Configurar Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. Instalar dependencias
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # 4. Verificar conexión con Supabase
      # ============================================================
      - name: Verify Supabase connection
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |
          python -c "
          import os
          import psycopg2

          print('==============================================')
          print('🔎 VERIFICACIÓN DE CONEXIÓN SUPABASE')
          print('==============================================')

          print(
              'PASSWORD CONFIGURADA:',
              bool(os.getenv('SUPABASE_DB_PASSWORD'))
          )

          conn = psycopg2.connect(
              host='aws-0-us-west-2.pooler.supabase.com',
              port=5432,
              database='postgres',
              user='postgres.cuxppijddpiuaxwyswfb',
              password=os.getenv('SUPABASE_DB_PASSWORD'),
              sslmode='require'
          )

          cur = conn.cursor()

          # --------------------------------------------------------
          # Comprobar a qué base de datos estamos conectados
          # --------------------------------------------------------
          cur.execute('''
              SELECT
                  current_database(),
                  current_user,
                  inet_server_addr(),
                  inet_server_port();
          ''')

          print('CONEXION:', cur.fetchone())


          # --------------------------------------------------------
          # Comprobar que existe el objeto necesario
          # --------------------------------------------------------
          cur.execute('''
              SELECT
                  n.nspname,
                  c.relname,
                  c.relkind
              FROM pg_class c
              JOIN pg_namespace n
                  ON n.oid = c.relnamespace
              WHERE n.nspname = 'gold_ml'
              AND c.relname = 'gold_ml.predicciones_verificadas_sin_intervencion';
          ''')

          resultado = cur.fetchone()

          print('OBJETO ENCONTRADO:', resultado)


          if resultado is None:
              print(
                  '❌ NO SE ENCONTRÓ '
                  'ggold_ml.predicciones_verificadas_sin_intervencion'
              )
              raise SystemExit(1)

          else:
              print(
                  '✅ EL OBJETO EXISTE Y ES VISIBLE DESDE GITHUB'
              )


          cur.close()
          conn.close()

          print('==============================================')
          print('✅ VERIFICACIÓN FINALIZADA')
          print('==============================================')
          "


      # ============================================================
      # 5. Reentrenar modelo
      # ============================================================
      - name: Retrain model
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |
          python main_reentrenamiento.py


      # ============================================================
      # 6. Generar predicciones
      # ============================================================
      - name: Generate predictions
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |
          python main_prediccion.py


      # ============================================================
      # 7. Instalar cliente PostgreSQL
      # ============================================================
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client


      # ============================================================
      # 8. Crear backup de Supabase
      # ============================================================
      - name: Backup Database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |
          mkdir -p backups

          pg_dump \
            -h aws-0-us-west-2.pooler.supabase.com \
            -p 5432 \
            -U postgres.cuxppijddpiuaxwyswfb \
            -d postgres \
            -F c \
            -f backups/siprem_backup.dump


      # ============================================================
      # 9. Guardar artifacts del modelo
      # ============================================================
      - name: Upload ML artifacts
        uses: actions/upload-artifact@v4

        if: always()

        with:
          name: siprem-ml-models

          path: |
            models/model.pkl
            models/encoders.pkl
            models/threshold_rf_sin_lote29.pkl
            models/candidate/*
            models/comparacion_modelos.csv
            models/diagnostico_lotes_rf_sin_lote29.csv
            models/predicciones_test_rf_sin_lote29.csv

          if-no-files-found: ignore


      # ============================================================
      # 10. Guardar predicciones
      # ============================================================
      - name: Upload predictions CSV
        uses: actions/upload-artifact@v4

        if: always()

        with:
          name: siprem-predictions

          path: |
            models/predicciones_dataset.csv

          if-no-files-found: ignore


      # ============================================================
      # 11. Guardar backup
      # ============================================================
      - name: Upload Backup
        uses: actions/upload-artifact@v4

        if: always()

        with:
          name: siprem-supabase-backup

          path: |
            backups/siprem_backup.dump

          if-no-files-found: ignore


      # ============================================================
      # 12. Final del pipeline
      # ============================================================
      - name: Pipeline finished
        run: |
          echo "=============================================="
          echo "🐄 SIPREM-BOVINO"
          echo "=============================================="
          echo "✅ Conexión Supabase verificada"
          echo "✅ Reentrenamiento ejecutado"
          echo "✅ Predicciones generadas"
          echo "✅ Backup realizado"
          echo "=============================================="
