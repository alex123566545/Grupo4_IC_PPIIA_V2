name: SIPREM-BOVINO ML Pipeline

on:

  # ============================================================
  # EJECUCIÓN AL HACER PUSH A MAIN
  # ============================================================
  push:
    branches:
      - main

  # ============================================================
  # EJECUCIÓN MANUAL
  # ============================================================
  workflow_dispatch:


jobs:

  siprem_pipeline:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Descargar el repositorio
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Configurar Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. Instalar dependencias Python
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # 4. Verificar conexión con Supabase
      # ============================================================
      - name: Verify Supabase connection
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |
          python -c "
          import os
          import psycopg2

          print('==============================================')
          print('🔎 VERIFICACIÓN DE CONEXIÓN SUPABASE')
          print('==============================================')

          print(
              'PASSWORD CONFIGURADA:',
              bool(os.getenv('SUPABASE_DB_PASSWORD'))
          )

          conn = psycopg2.connect(
              host='aws-0-us-west-2.pooler.supabase.com',
              port=5432,
              database='postgres',
              user='postgres.cuxppijddpiuaxwyswfb',
              password=os.getenv('SUPABASE_DB_PASSWORD'),
              sslmode='require'
          )

          cur = conn.cursor()

          # --------------------------------------------------------
          # Comprobar a qué base de datos estamos conectados
          # --------------------------------------------------------
          cur.execute('''
              SELECT
                  current_database(),
                  current_user,
                  inet_server_addr(),
                  inet_server_port();
          ''')

          print('CONEXION:', cur.fetchone())


          # --------------------------------------------------------
          # Comprobar que existe la vista necesaria
          # --------------------------------------------------------
          cur.execute('''
              SELECT
                  n.nspname,
                  c.relname,
                  c.relkind
              FROM pg_class c
              JOIN pg_namespace n
                  ON n.oid = c.relnamespace
              WHERE n.nspname = 'gold_ml'
                AND c.relname = 'predicciones_verificadas_sin_intervencion'
                AND c.relkind = 'v';
          ''')

          resultado = cur.fetchone()

          print('VISTA ENCONTRADA:', resultado)


          if resultado is None:

              print(
                  '❌ NO SE ENCONTRÓ LA VISTA '
                  'gold_ml.predicciones_verificadas_sin_intervencion'
              )

              raise SystemExit(1)

          else:

              print(
                  '✅ LA VISTA EXISTE Y ES VISIBLE DESDE GITHUB'
              )


          cur.close()
          conn.close()

          print('==============================================')
          print('✅ VERIFICACIÓN FINALIZADA')
          print('==============================================')
          "


      # ============================================================
      # 5. Generar predicciones
      # ============================================================
      - name: Generate predictions
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |

          echo "=============================================="
          echo "🐄 GENERANDO PREDICCIONES"
          echo "=============================================="

          python main_prediccion.py


      # ============================================================
      # 6. Reentrenar modelo
      #
      # IMPORTANTE:
      # Este paso se ejecuta DESPUÉS de generar predicciones.
      #
      # Las predicciones que hayan cumplido 4 semanas
      # deben haber sido verificadas previamente en Supabase.
      # ============================================================
      - name: Retrain model
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |

          echo "=============================================="
          echo "🧠 INICIANDO REENTRENAMIENTO"
          echo "=============================================="

          python main_reentrenamiento.py


      # ============================================================
      # 7. Instalar PostgreSQL Client 17
      # ============================================================
      - name: Install PostgreSQL Client 17
        run: |

          echo "=============================================="
          echo "📦 INSTALANDO POSTGRESQL CLIENT 17"
          echo "=============================================="

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            ca-certificates \
            gnupg

          # --------------------------------------------------------
          # Agregar repositorio oficial de PostgreSQL (PGDG)
          # --------------------------------------------------------
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/postgresql.gpg

          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          # --------------------------------------------------------
          # Actualizar repositorios
          # --------------------------------------------------------
          sudo apt-get update

          # --------------------------------------------------------
          # Instalar PostgreSQL Client 17
          # --------------------------------------------------------
          sudo apt-get install -y postgresql-client-17

          echo "=============================================="
          echo "🔎 VERSIÓN DE PG_DUMP"
          echo "=============================================="

          /usr/lib/postgresql/17/bin/pg_dump --version


      # ============================================================
      # 8. Crear backup de Supabase
      # ============================================================
      - name: Backup Database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |

          echo "=============================================="
          echo "💾 CREANDO BACKUP DE SUPABASE"
          echo "=============================================="

          mkdir -p backups

          /usr/lib/postgresql/17/bin/pg_dump \
            -h aws-0-us-west-2.pooler.supabase.com \
            -p 5432 \
            -U postgres.cuxppijddpiuaxwyswfb \
            -d postgres \
            -F c \
            -f backups/siprem_backup.dump

          echo "=============================================="
          echo "✅ BACKUP CREADO"
          echo "=============================================="

          ls -lh backups/siprem_backup.dump


      # ============================================================
      # 9. Guardar artifacts del modelo
      # ============================================================
      - name: Upload ML artifacts
        uses: actions/upload-artifact@v4

        if: always()

        with:
          name: siprem-ml-models

          path: |
            models/model.pkl
            models/encoders.pkl
            models/threshold_rf_sin_lote29.pkl
            models/candidate/*
            models/comparacion_modelos.csv
            models/diagnostico_lotes_rf_sin_lote29.csv
            models/predicciones_test_rf_sin_lote29.csv

          if-no-files-found: ignore


      # ============================================================
      # 10. Guardar predicciones CSV
      # ============================================================
      - name: Upload predictions CSV
        uses: actions/upload-artifact@v4

        if: always()

        with:
          name: siprem-predictions

          path: |
            models/predicciones_dataset.csv

          if-no-files-found: ignore


      # ============================================================
      # 11. Guardar backup
      # ============================================================
      - name: Upload Backup
        uses: actions/upload-artifact@v4

        if: always()

        with:
          name: siprem-supabase-backup

          path: |
            backups/siprem_backup.dump

          if-no-files-found: ignore


      # ============================================================
      # 12. Final del pipeline
      # ============================================================
      - name: Pipeline finished
        run: |

          echo "=============================================="
          echo "🐄 SIPREM-BOVINO"
          echo "=============================================="

          echo "✅ Conexión Supabase verificada"
          echo "✅ Vista de entrenamiento verificada"
          echo "✅ Predicciones generadas"
          echo "✅ Reentrenamiento ejecutado"
          echo "✅ Backup realizado"

          echo "=============================================="
