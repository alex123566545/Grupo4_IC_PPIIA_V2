```yaml
name: SIPREM-BOVINO ML Pipeline

on:

  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '0 6 * * 1'


jobs:

  siprem_pipeline:

    runs-on: ubuntu-latest

    steps:

      # =====================================
      # CLONAR REPOSITORIO
      # =====================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================
      # CONFIGURAR PYTHON
      # =====================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================
      # INSTALAR DEPENDENCIAS
      # =====================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =====================================
      # REENTRENAMIENTO DEL MODELO
      # =====================================
      - name: Retrain model
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python main_reentrenamiento.py


      # =====================================
      # GENERAR PREDICCIONES
      # =====================================
      - name: Generate predictions
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python main_prediccion.py


      # =====================================
      # INSTALAR POSTGRESQL CLIENT
      # =====================================
      - name: Install PostgreSQL Client
        run: |

          sudo apt-get update

          sudo apt-get install -y postgresql-client


      # =====================================
      # CREAR RESPALDO
      # =====================================
      - name: Backup Database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |

          mkdir -p backups

          pg_dump \
            -h aws-0-us-west-2.pooler.supabase.com \
            -p 5432 \
            -U postgres.cuxppijddpiuaxwyswfb \
            -d postgres \
            -F c \
            -f backups/siprem_backup.dump


      # =====================================
      # SUBIR ARTIFACTS DEL MODELO
      # =====================================
      - name: Upload ML artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siprem-ml-models
          path: |
            models/model.pkl
            models/encoders.pkl
            models/threshold_rf_sin_lote29.pkl
            models/candidate/*
            models/comparacion_modelos.csv
            models/diagnostico_lotes_rf_sin_lote29.csv
            models/predicciones_test_rf_sin_lote29.csv
          if-no-files-found: ignore


      # =====================================
      # SUBIR PREDICCIONES
      # =====================================
      - name: Upload predictions CSV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siprem-predictions
          path: models/predicciones_dataset.csv
          if-no-files-found: ignore


      # =====================================
      # SUBIR RESPALDO
      # =====================================
      - name: Upload Backup
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siprem-supabase-backup
          path: backups/siprem_backup.dump
          if-no-files-found: ignore


      # =====================================
      # FIN
      # =====================================
      - name: Pipeline finished
        run: echo "🚀 REENTRENAMIENTO + PREDICCIONES + BACKUP ejecutado correctamente"
```