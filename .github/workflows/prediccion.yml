name: SIPREM-BOVINO - Predicciones

on:

  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '0 6 * * 1'


jobs:

  prediccion:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Descargar el repositorio
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Configurar Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. Instalar dependencias Python
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # 4. Verificar conexión con Supabase
      # ============================================================
      - name: Verify Supabase connection
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |
          python -c "
          import os
          import psycopg2

          print('==============================================')
          print('🔎 VERIFICACIÓN DE CONEXIÓN SUPABASE')
          print('==============================================')

          print(
              'PASSWORD CONFIGURADA:',
              bool(os.getenv('SUPABASE_DB_PASSWORD'))
          )

          conn = psycopg2.connect(
              host='aws-0-us-west-2.pooler.supabase.com',
              port=5432,
              database='postgres',
              user='postgres.cuxppijddpiuaxwyswfb',
              password=os.getenv('SUPABASE_DB_PASSWORD'),
              sslmode='require'
          )

          cur = conn.cursor()

          cur.execute('''
              SELECT
                  current_database(),
                  current_user,
                  inet_server_addr(),
                  inet_server_port();
          ''')

          print('CONEXION:', cur.fetchone())

          cur.close()
          conn.close()

          print('==============================================')
          print('✅ CONEXIÓN VERIFICADA')
          print('==============================================')
          "


      # ============================================================
      # 5. Generar predicciones
      # ============================================================
      - name: Generate predictions
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        run: |
          python main_prediccion.py


      # ============================================================
      # 6. Guardar predicciones CSV
      # ============================================================
      - name: Upload predictions CSV
        uses: actions/upload-artifact@v4

        if: always()

        with:
          name: siprem-predictions

          path: |
            models/predicciones_dataset.csv

          if-no-files-found: ignore


      # ============================================================
      # 7. Final
      # ============================================================
      - name: Prediction pipeline finished
        run: |

          echo "=============================================="
          echo "🐄 SIPREM-BOVINO"
          echo "=============================================="
          echo "✅ Conexión Supabase verificada"
          echo "✅ Predicciones generadas"
          echo "=============================================="
          echo "⏳ Las predicciones quedan pendientes"
          echo "   de verificación hasta cumplir"
          echo "   el horizonte de 4 semanas."
          echo "=============================================="
