name: SIPREM-BOVINO - Reentrenamiento

on:
  workflow_dispatch:

jobs:
  reentrenamiento:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Supabase and training view
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python -c "
          import os
          import psycopg2

          print('==============================================')
          print('VERIFICACION DE SUPABASE')
          print('==============================================')

          print(
              'PASSWORD CONFIGURADA:',
              bool(os.getenv('SUPABASE_DB_PASSWORD'))
          )

          conn = psycopg2.connect(
              host='aws-0-us-west-2.pooler.supabase.com',
              port=5432,
              database='postgres',
              user='postgres.cuxppijddpiuaxwyswfb',
              password=os.getenv('SUPABASE_DB_PASSWORD'),
              sslmode='require'
          )

          cur = conn.cursor()

          cur.execute('''
              SELECT
                  current_database(),
                  current_user,
                  inet_server_addr(),
                  inet_server_port();
          ''')

          print('CONEXION:', cur.fetchone())

          cur.execute('''
              SELECT
                  n.nspname,
                  c.relname,
                  c.relkind
              FROM pg_class c
              JOIN pg_namespace n
                  ON n.oid = c.relnamespace
              WHERE n.nspname = 'gold_ml'
                AND c.relname =
                    'predicciones_verificadas_sin_intervencion'
                AND c.relkind = 'v';
          ''')

          resultado = cur.fetchone()

          print('VISTA ENCONTRADA:', resultado)

          if resultado is None:
              print(
                  'NO SE ENCONTRO LA VISTA '
                  'gold_ml.predicciones_verificadas_sin_intervencion'
              )
              raise SystemExit(1)

          print(
              'LA VISTA EXISTE Y ES VISIBLE DESDE GITHUB'
          )

          cur.close()
          conn.close()

          print('==============================================')
          print('VERIFICACION FINALIZADA')
          print('==============================================')
          "

      - name: Retrain model
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python main_reentrenamiento.py

      - name: Upload ML artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siprem-ml-models
          path: |
            models/model.pkl
            models/encoders.pkl
            models/threshold_rf_sin_lote29.pkl
            models/candidate/*
            models/comparacion_modelos.csv
            models/diagnostico_lotes_rf_sin_lote29.csv
            models/predicciones_test_rf_sin_lote29.csv
          if-no-files-found: ignore

      - name: Retraining pipeline finished
        run: |
          echo "=============================================="
          echo "SIPREM-BOVINO"
          echo "=============================================="
          echo "Conexion Supabase verificada"
          echo "Vista de entrenamiento verificada"
          echo "Reentrenamiento ejecutado"
          echo "Artifacts guardados"
          echo "=============================================="
